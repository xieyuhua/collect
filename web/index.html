<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>采集平台 · Collect</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E9%87%87%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app"></div>

<script src="/vendor/vue.global.prod.js"></script>
<script src="/js/core.js"></script>
<script src="/js/app.js"></script>
<script src="/js/page-dashboard.js"></script>
<script src="/js/page-tasks.js"></script>
<script src="/js/page-editor.js"></script>
<script src="/js/page-runs.js"></script>
<script src="/js/page-jobs.js"></script>
<script src="/js/page-studio.js"></script>
<script src="/js/page-systems.js"></script>
<script>
(function () {
  /* 兼容旧调用方式：页面内可直接使用 openModal / closeModal / toast / api */
  window.openModal = function (title, body, props) { Collect.openModal(title, body, props); };
  window.closeModal = function () { Collect.closeModal(); };
  window.toast = function (msg, type) { Collect.toast(msg, type); };
  window.api = function (path, opt) { return Collect.api(path, opt); };

  Collect.syncRoute();
  window.addEventListener('hashchange', Collect.syncRoute);
  if (!location.hash) {
    location.replace('#/dashboard');
  }

  const app = Vue.createApp({
    template: '<app-shell />',
  });
  /* 模板里需要用到全局对象 Collect（浏览器版编译器只放行白名单全局） */
  app.config.globalProperties.Collect = Collect;
  Object.keys(Collect.components).forEach(function (name) {
    app.component(name, Collect.components[name]);
  });
  app.config.errorHandler = function (err) {
    console.error('[vue]', err);
    Collect.toast('页面渲染异常：' + (err && err.message ? err.message : err), 'err');
  };
  app.mount('#app');
})();
</script>
</body>
</html>
